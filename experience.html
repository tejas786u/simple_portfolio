  <!-- ========== EXPERIENCE ========== -->
  <section class="section section-alt" id="experience">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">10+ years of impact</span>
        <h2 class="section-title">Experience</h2>
      </div>

      <div class="timeline">
        {{#each experience}}
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="timeline-header">
              <div>
                <h3 class="timeline-title">{{this.role}}</h3>
                <p class="timeline-subtitle">{{this.company}}</p>
              </div>
              <span class="timeline-badge">{{this.years}}</span>
            </div>
            <p class="timeline-desc">{{this.desc}}</p>
            <div class="timeline-tags">
              {{#each this.tags}}
              <span class="tag">{{this}}</span>
              {{/each}}
            </div>
          </div>
        </div>
        {{/each}}
      </div>
    </div>
  </section>
