  <!-- ========== HERO / ABOUT ========== -->
  <section class="hero" id="about">
    <div class="hero-bg">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="grid-overlay"></div>
    </div>

    <div class="hero-content">
      <div class="hero-avatar">
        <img src="{{about.avatar}}" alt="{{about.name}}" class="avatar-photo" />
        <div class="avatar-ring"></div>
        <div class="avatar-status">
          <span class="status-dot"></span>
          <span>{{about.status}}</span>
        </div>
      </div>

      <div class="hero-text">
        <p class="hero-greeting">{{about.greeting}}</p>
        <h1 class="hero-name">{{about.name}}</h1>
        <div class="hero-title">
          <span class="title-prefix">{{about.rolePrefix}}</span>
          <span class="typing-wrapper">
            <span class="typing-text" id="typingText"></span>
            <span class="cursor">|</span>
          </span>
        </div>

        <p class="hero-bio">
          {{about.bio}}
        </p>

        <div class="hero-cta">
          <a href="#contact" class="btn btn-primary">
            <i class="fas fa-paper-plane"></i> Get in Touch
          </a>
          <a href="#resume" class="btn btn-secondary">
            <i class="fas fa-file-arrow-down"></i> Download CV
          </a>
        </div>

        <div class="hero-socials">
          <a href="{{about.socials.github}}" target="_blank" class="social-icon" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="{{about.socials.linkedin}}" target="_blank" class="social-icon" aria-label="LinkedIn">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="mailto:{{about.socials.email}}" class="social-icon" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
        </div>
      </div>
    </div>

    <div class="scroll-indicator">
      <div class="scroll-mouse">
        <div class="scroll-wheel"></div>
      </div>
      <span>Scroll to explore</span>
    </div>
  </section>
