  <!-- ========== EDUCATION ========== -->
  <section class="section section-alt" id="education">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">Academic background</span>
        <h2 class="section-title">Education</h2>
      </div>

      <div class="timeline">
        {{#each education}}
        <div class="timeline-item">
          <div class="timeline-dot"></div>
          <div class="timeline-card">
            <div class="timeline-header">
              <div><h3 class="timeline-title">{{this.degree}}</h3><p class="timeline-subtitle">{{this.university}}</p></div>
              <span class="timeline-badge">{{this.years}}</span>
            </div>
            <p class="timeline-desc">{{this.desc}}</p>
          </div>
        </div>
        {{/each}}
      </div>
    </div>
  </section>
