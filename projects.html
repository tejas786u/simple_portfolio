  <!-- ========== PROJECTS ========== -->
  <section class="section" id="projects">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">What I've shipped</span>
        <h2 class="section-title">Projects</h2>
      </div>

      <div class="projects-grid">
        {{#each projects}}
        <div class="project-card {{#if this.featured}}featured{{/if}}">
          <div class="project-image">
            <div class="project-img-placeholder"><i class="{{this.icon}}"></i></div>
            <span class="project-badge">{{this.badge}}</span>
          </div>
          <div class="project-content">
            <h3>{{this.title}}</h3>
            <p>{{this.desc}}</p>
            <div class="project-tags">
              {{#each this.tags}}
              <span class="tag">{{this}}</span>
              {{/each}}
            </div>
            <div class="project-links">
              {{#each this.links}}
              <a href="{{this.url}}" class="project-link {{#if this.primary}}primary{{/if}}"><i class="{{this.icon}}"></i> {{this.label}}</a>
              {{/each}}
            </div>
          </div>
        </div>
        {{/each}}
      </div>
    </div>
  </section>
