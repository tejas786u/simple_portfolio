<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tejaskumar Patel — Senior iOS Developer</title>
  <link rel="stylesheet" href="style.css" />

  <!--
  ============================================================
  FONT: Google Product Sans (via Google Fonts approximation)
  Product Sans isn't publicly available via CDN, so we use
  "Google Sans" fallback approach with Nunito as the closest
  open-source match. If you have access to Product Sans,
  replace the @font-face in style.css.
  ============================================================
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;500;600;700;800;900&family=Nunito+Sans:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>

  <!-- ========== NAVBAR ========== -->
  <nav class="navbar" id="navbar">
    <div class="construction-banner">
      <i class="fas fa-triangle-exclamation"></i>
      <span>Site under construction — some information may not be correct.</span>
    </div>

    <div class="nav-brand">
      <!-- ✏️ UPDATE: Your initials or short name -->
      <span class="brand-text">TP</span>
    </div>

    <!-- Links are dynamically injected here by main.js based on the data-section sequence below -->
    <ul class="nav-links" id="navLinks"></ul>

    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-moon" id="themeIcon"></i>
      </button>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Content will be dynamically loaded here by main.js -->
  <main id="main-content">
    <!-- ✏️ UPDATE: Rearrange these lines to change the display order on the page -->
    <div data-section="about"></div>
    <div data-section="skills"></div>
    <div data-section="experience"></div>
    <div data-section="projects"></div>
    <div data-section="certifications"></div>
    <div data-section="education"></div>
    <div data-section="interests"></div>
    <div data-section="resume"></div>
    <div data-section="contact"></div>
  </main>

  <!-- ========== FOOTER ========== -->
  <footer class="footer">
    <div class="container">
      <p>
        <!-- ✏️ UPDATE: Your name -->
        Designed & built by <strong>Tejaskumar Patel</strong> · 2026
      </p>
      <p class="footer-sub">Senior iOS Developer · Berlin, Germany</p>
    </div>
  </footer>

  <script src="main.js"></script>
</body>
</html>
