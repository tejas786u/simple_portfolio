  <!-- ========== RESUME ========== -->
  <section class="section" id="resume">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">Full details</span>
        <h2 class="section-title">Resume</h2>
      </div>

      <div class="resume-card">
        <div class="resume-preview">
          <div class="resume-icon">
            <i class="fas fa-file-pdf"></i>
          </div>
          <div class="resume-meta">
            <h3>{{resume.filename}}</h3>
            <p>{{resume.subtitle}}</p>
            <span class="resume-updated">Last updated: {{resume.updated}}</span>
          </div>
        </div>
        <div class="resume-actions">
          <a href="{{resume.pdfUrl}}" download class="btn btn-primary">
            <i class="fas fa-file-arrow-down"></i> Download PDF
          </a>
          <a href="{{resume.viewUrl}}" target="_blank" class="btn btn-secondary">
            <i class="fas fa-eye"></i> View Online
          </a>
        </div>
      </div>
    </div>
  </section>
