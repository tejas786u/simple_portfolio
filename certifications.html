  <!-- ========== CERTIFICATIONS ========== -->
  <section class="section" id="certifications">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">Continuous learning</span>
        <h2 class="section-title">Online Certifications</h2>
      </div>

      <div class="cert-grid">
        {{#each certifications}}
        <div class="cert-card">
          <div class="cert-logo"><i class="{{this.icon}}"></i></div>
          <div class="cert-info">
            <h3>{{this.title}}</h3>
            <p class="cert-issuer">{{this.issuer}}</p>
            <p class="cert-date">{{this.year}}</p>
          </div>
          <a href="{{this.link}}" target="_blank" class="cert-link"><i class="fas fa-arrow-up-right-from-square"></i></a>
        </div>
        {{/each}}
      </div>
    </div>
  </section>
