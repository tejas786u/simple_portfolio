  <!-- ========== CONTACT ========== -->
  <section class="section section-alt" id="contact">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">Let's talk</span>
        <h2 class="section-title">Contact Info</h2>
      </div>

      <div class="contact-grid">
        <div class="contact-info">
          <p class="contact-intro">
            {{contact.intro}}
          </p>

          <div class="contact-items">
            <div class="contact-item">
              <div class="contact-icon"><i class="fas fa-envelope"></i></div>
              <div>
                <p class="contact-label">Email</p>
                <a href="mailto:{{contact.email}}" class="contact-value">{{contact.email}}</a>
              </div>
            </div>

            <!-- <div class="contact-item">
              <div class="contact-icon"><i class="fas fa-phone"></i></div>
              <div>
                <p class="contact-label">Phone</p>
                <a href="tel:{{contact.phoneUrl}}" class="contact-value">{{contact.phoneDisplay}}</a>
              </div>
            </div> -->

            <div class="contact-item">
              <div class="contact-icon"><i class="fas fa-location-dot"></i></div>
              <div>
                <p class="contact-label">Location</p>
                <p class="contact-value">{{contact.location}}</p>
              </div>
            </div>

            <div class="contact-item">
              <div class="contact-icon"><i class="fab fa-linkedin-in"></i></div>
              <div>
                <p class="contact-label">LinkedIn</p>
                <a href="{{contact.linkedinUrl}}" target="_blank" class="contact-value">{{contact.linkedinDisplay}}</a>
              </div>
            </div>

            <div class="contact-item">
              <div class="contact-icon"><i class="fab fa-github"></i></div>
              <div>
                <p class="contact-label">GitHub</p>
                <a href="{{contact.githubUrl}}" target="_blank" class="contact-value">{{contact.githubDisplay}}</a>
              </div>
            </div>
          </div>
        </div>

        <!-- Contact Form -->
        <div class="contact-form-wrapper">
          <form class="contact-form" id="contactForm" action="{{contact.formEndpoint}}" method="POST">
            <div class="form-group">
              <label for="name">Your Name</label>
              <input type="text" id="name" name="name" placeholder="John Smith" required />
            </div>
            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" name="email" placeholder="john@company.com" required />
            </div>
            <div class="form-group">
              <label for="subject">Subject</label>
              <input type="text" id="subject" name="subject" placeholder="Senior iOS Developer Opportunity" />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5" placeholder="Hi Tejas, I came across your portfolio and..." required></textarea>
            </div>
            <button type="submit" class="btn btn-primary full-width">
              <i class="fas fa-paper-plane"></i> Send Message
            </button>
          </form>
          <div class="form-success" id="formSuccess" style="display:none;">
            <i class="fas fa-circle-check"></i>
            <p>Message sent! I'll get back to you soon.</p>
          </div>
        </div>
      </div>
    </div>
  </section>
