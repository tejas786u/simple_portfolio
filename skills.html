  <!-- ========== SKILLS ========== -->
  <section class="section section-alt" id="skills">
    <div class="container">
      <div class="section-header">
        <span class="section-tag">My toolkit</span>
        <h2 class="section-title">Skills</h2>
      </div>

      <div class="skills-container">
        {{#each skills}}
        <div class="skill-group">
          <h3 class="skill-group-title"><i class="{{this.icon}}"></i> {{this.category}}</h3>
          <div class="skill-pills">
            {{#each this.items}}
            <span class="skill-pill {{this.level}}">{{this.name}}</span>
            {{/each}}
          </div>
        </div>
        {{/each}}
      </div>

      <!-- Skill Legend -->
      <div class="skill-legend">
        <span><span class="skill-pill expert mini">Expert</span></span>
        <span><span class="skill-pill advanced mini">Advanced</span></span>
        <span><span class="skill-pill learning mini">Learning</span></span>
      </div>
    </div>
  </section>
